<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin Dashboard</title>
    <!-- استفاده از Bootstrap برای ظاهر بهتر -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e1e1e; border: 1px solid #333; color: white; border-radius: 15px; }
        .status-ok { color: #2ecc71; font-weight: bold; }
        .status-warning { color: #f1c40f; font-weight: bold; }
        .status-error { color: #e74c3c; font-weight: bold; }
        .value-display { font-size: 2.5rem; font-weight: bold; color: #00d4ff; }
        .timestamp { font-size: 0.8rem; color: #888; }
    </style>
    <!-- صفحه برای دریافت داده‌های جدید هر ۲ ثانیه رفرش می‌شود -->
    <meta http-equiv="refresh" content="2">
</head>
<body>

<div class="container mt-5">
    <div class="row mb-4">
        <div class="col text-center">
            <h1 class="display-4">Industrial Digital Twin</h1>
            <p class="text-muted">Real-time RTU Monitoring</p>
        </div>
    </div>

    <div class="row text-center">
        <!-- کارت دما -->
        <div class="col-md-4 mb-4">
            <div class="card p-4 shadow">
                <h5>Temperature</h5>
                <div class="value-display">{{ data.temperature }}°C</div>
            </div>
        </div>

        <!-- کارت فشار -->
        <div class="col-md-4 mb-4">
            <div class="card p-4 shadow">
                <h5>Pressure</h5>
                <div class="value-display">{{ data.pressure }} bar</div>
            </div>
        </div>

        <!-- کارت وضعیت -->
        <div class="col-md-4 mb-4">
            <div class="card p-4 shadow">
                <h5>System Status</h5>
                <div class="{% if data.status == 'OK' %}status-ok{% elif data.status == 'WARNING' %}status-warning{% else %}status-error{% endif %}">
                    {{ data.status }}
                </div>
                <div class="timestamp mt-3">Last Update: {{ data.timestamp }}</div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
