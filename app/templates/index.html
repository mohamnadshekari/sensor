<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .card { background-color: #1e293b; border-radius: 1rem; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-center text-blue-400">Digital Twin: Industrial RTU Monitor</h1>
        
        <!-- بخش نمایش اعداد اصلی -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="card text-center">
                <p class="text-gray-400 text-sm">دما (Temperature)</p>
                <p id="temp-val" class="text-4xl font-bold text-orange-500">--</p>
                <p class="text-xs text-gray-500 mt-2">°C</p>
            </div>
            <div class="card text-center">
                <p class="text-gray-400 text-sm">فشار (Pressure)</p>
                <p id="pres-val" class="text-4xl font-bold text-blue-500">--</p>
                <p class="text-xs text-gray-500 mt-2">Bar</p>
            </div>
            <div class="card text-center">
                <p class="text-gray-400 text-sm">وضعیت سیستم (Status)</p>
                <p id="status-val" class="text-2xl font-bold text-green-500">--</p>
                <p id="time-val" class="text-xs text-gray-500 mt-2">--</p>
            </div>
        </div>

        <!-- بخش نمودار -->
        <div class="card">
            <canvas id="liveChart" height="100"></canvas>
        </div>
    </div>

    <script>
        // تنظیمات نمودار
        const ctx = document.getElementById('liveChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Temperature (°C)',
                    borderColor: '#f97316',
                    data: [],
                    tension: 0.4
                }, {
                    label: 'Pressure (Bar)',
                    borderColor: '#3b82f6',
                    data: [],
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: { display: true, grid: { color: '#334155' } },
                    y: { display: true, grid: { color: '#334155' } }
                }
            }
        });

        // تابع دریافت داده از سرور (AJAX)
        async function fetchData() {
            try {
                const response = await fetch('/api/data'); // ما یک Route جدید در Flask می‌سازیم
                const data = await response.json();

                // آپدیت اعداد
                document.getElementById('temp-val').innerText = data.temperature.toFixed(1);
                document.getElementById('pres-val').innerText = data.pressure.toFixed(1);
                document.getElementById('status-val').innerText = data.status;
                document.getElementById('time-val').innerText = data.timestamp;

                // آپدیت نمودار
                const now = new Date().toLocaleTimeString();
                chart.data.labels.push(now);
                chart.data.datasets[0].data.push(data.temperature);
                chart.data.datasets[1].data.push(data.pressure);

                // محدود کردن تعداد نقاط نمودار (برای جلوگیری از کند شدن)
                if (chart.data.labels.length > 20) {
                    chart.data.labels.shift();
                    chart.data.datasets[0].data.shift();
                    chart.data.datasets[1].data.shift();
                }
                chart.update();

            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        // درخواست داده هر 2 ثانیه یک بار
        setInterval(fetchData, 2000);
    </script>
</body>
</html>
